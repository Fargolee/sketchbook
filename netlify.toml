[build]
  publish = "."

# The page is one static file. Fonts, sketches and textures never change
# without a new filename, so they can sit in the cache for a year.
[[headers]]
  for = "/sketchbook/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
